<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <link rel="shortcut icon" href="assets/pippi.ico" type="image/x-icon" />
    <script src="index.js"></script>
    <title>osu-scout</title>
  </head>
  <body>
    <nav>
      <div class="logo">osu-scout</div>
      <div class="config">
        <div class="config-field">
          <label for="star_rating">⭐ <code>min-max</code></label>
          <input
            class="min-max"
            type="text"
            id="star_rating"
            placeholder="4.2-4.9"
            value="4.5"
          />
        </div>
        <div class="config-field">
          <label for="ar">AR <code>min-max</code></label>
          <input
            class="min-max"
            type="text"
            id="ar"
            placeholder="8.5-9.2"
            value="9-9"
          />
        </div>
        <div class="config-field">
          <label for="bpm">BPM <code>min-max</code></label>
          <input
            class="min-max"
            type="text"
            id="bpm"
            placeholder="140-180"
            value="180-200"
          />
        </div>
        <button id="search">Go! 🔍</button>
        <button id="share" class="share-bg-color">Share 🔗</button>
      </div>
    </nav>
    <main>
      <div id="advanced">
        <div class="opt">
          <h1>Advanced options</h1>
          <button class="" id="adv-opt-hide-btn">Show</button>
          <div class="presets-wrapper">
            <div class="opt">
              <h1>Search presets</h1>
              <hr />
              <br />
              <div class="filters">
                <div id="aim-preset">Aim maps</div>
                <div id="stream-preset">Stream maps</div>
                <div id="clear-all">Clear all</div>
              </div>
            </div>
            <br />
            <hr />
            <br />
          </div>
          <div class="config">
            <div class="config-field">
              <label
                for="avg_num_jumps"
                style="background-color: rgb(228, 87, 46, 0.3)"
                >Avg # jumps per jump section <code>min-max</code></label
              >
              <input
                type="text"
                class="min-max"
                id="avg_num_jumps"
                placeholder="0-727"
                value="10"
              />
            </div>

            <div class="config-field">
              <label
                for="num_burst_secs"
                style="background-color: rgb(243, 167, 18, 0.3)"
                >Number of bursts <code>min-max</code></label
              >
              <input
                type="text"
                class="min-max"
                id="num_burst_secs"
                placeholder="0-727"
                value=""
              />
            </div>

            <div class="config-field">
              <label
                for="avg_stream_length"
                style="background-color: rgb(41, 51, 92, 0.3)"
                >Avg stream length <code>min-max</code></label
              >
              <input
                type="text"
                class="min-max"
                id="avg_stream_length"
                placeholder="0-727"
                value="0-0"
              />
            </div>

            <div class="config-field">
              <label
                for="overall_irr_percent"
                style="background-color: rgb(168, 198, 134, 0.3)"
                >Irregular rhythm score (%) <code>min-max</code></label
              >
              <input
                type="text"
                class="min-max"
                id="overall_irr_percent"
                placeholder="0-100"
                value="0-10"
              />
            </div>

            <div class="config-field">
              <label
                for="max_combo"
                style="background-color: rgb(254, 95, 85, 0.3)"
                >Max combo <code>min-max</code></label
              >
              <input
                class="min-max"
                type="text"
                id="max_combo"
                placeholder="924-924"
              />
            </div>

            <div class="config-field">
              <label
                for="pp_100"
                style="background-color: rgb(155, 41, 21, 0.3)"
                >PP 100% <code>min-max</code></label
              >
              <input
                class="min-max"
                type="text"
                id="pp_100"
                placeholder="170-200"
              />
            </div>

            <div class="config-field">
              <label for="pp_95" style="background-color: rgb(155, 41, 21, 0.3)"
                >PP 95% <code>min-max</code></label
              >
              <input
                class="min-max"
                type="text"
                id="pp_95"
                placeholder="140-170"
              />
            </div>

            <div class="config-field">
              <label
                for="stream-density"
                style="background-color: rgb(102, 155, 188, 0.3)"
                >Stream Density <code>min-max</code></label
              >
              <input
                class="min-max"
                type="text"
                id="stream-density"
                placeholder="0-7.27"
              />
            </div>

            <div class="config-field">
              <label
                for="stream-spacing"
                style="background-color: rgb(102, 155, 188, 0.3)"
                >Stream Spacing <code>min-max</code></label
              >
              <input
                class="min-max"
                type="text"
                id="stream-spacing"
                placeholder="0-5"
              />
            </div>

            <div class="config-field">
              <label for="id" style="background-color: rgb(134, 22, 87, 0.3)"
                >Beatmap ID</label
              >
              <input type="text" id="id" placeholder="54697" />
            </div>

            <div class="config-field">
              <label
                for="beatmapset_id"
                style="background-color: rgb(134, 22, 87, 0.3)"
                >Beatmapset ID</label
              >
              <input type="text" id="beatmapset_id" placeholder="14983" />
            </div>

            <div class="config-field">
              <label
                for="title"
                style="background-color: rgb(170, 68, 101, 0.3)"
                >Title</label
              >
              <input
                type="text"
                id="title"
                class="text-search"
                placeholder="Numb (Nightcore Ver.)"
              />
            </div>

            <div class="config-field">
              <label
                for="artist"
                style="background-color: rgb(170, 68, 101, 0.3)"
                >Artist</label
              >
              <input
                type="text"
                id="artist"
                class="text-search"
                placeholder="Jan Wayne Vs. Raindropz"
              />
            </div>

            <div class="config-field">
              <label
                for="creator"
                style="background-color: rgb(170, 68, 101, 0.3)"
                >Creator</label
              >
              <input
                class="text-search"
                type="text"
                id="creator"
                placeholder="KIA"
              />
            </div>

            <div class="config-field">
              <label for="tags" style="background-color: rgb(170, 68, 101, 0.3)"
                >Tags</label
              >
              <input
                type="text"
                id="tags"
                class="text-search"
                placeholder="electronic english linkin park"
              />
            </div>

            <div class="config-field">
              <label
                for="version"
                style="background-color: rgb(170, 68, 101, 0.3)"
                >Difficulty name</label
              >
              <input
                class="text-search"
                type="text"
                id="version"
                placeholder="SteRRuM's Insane"
              />
            </div>
          </div>
        </div>
      </div>
    </main>
    <div id="loading">Loading...</div>
    <div class="beatmap-container"></div>
    <div id="footer">
      <button class="prev-btn">prev</button>
      <button class="next-btn">next</button>
    </div>
  </body>
</html>
